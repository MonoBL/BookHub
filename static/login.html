<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookHub — Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#16213e">
</head>
<body>
  <div class="offline-banner" id="offline-banner">Offline — login requires a connection</div>
  <main style="max-width:400px;padding-top:4rem">
    <div class="card">
      <h2 style="margin-bottom:1.5rem">BookHub</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="error-msg" id="error-msg" hidden></div>
        <button type="submit" id="submit-btn" style="width:100%">Sign in</button>
      </form>
    </div>
  </main>
  <script src="/static/app.js"></script>
  <script>
    (function () {
      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("error-msg");
      const btn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.hidden = true;
        btn.disabled = true;

        const body = {
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        };

        try {
          const resp = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          if (resp.ok) {
            const data = await resp.json();
            window.location.href = data.must_change_password ? "/change-password" : "/";
          } else {
            const err = await resp.json().catch(() => ({}));
            if (resp.status === 429) {
              errorEl.textContent = "Too many attempts — try again in a minute.";
            } else {
              errorEl.textContent = err.detail || "Invalid credentials.";
            }
            errorEl.hidden = false;
            btn.disabled = false;
          }
        } catch {
          errorEl.textContent = "Network error — check your connection.";
          errorEl.hidden = false;
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
