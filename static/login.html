<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookHub — Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#16213e">
</head>
<body>
  <div class="offline-banner" id="offline-banner">Offline — login requires a connection</div>
  <main style="max-width:400px;padding-top:4rem">
    <div class="card">
      <h2 style="margin-bottom:1.5rem">BookHub</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="error-msg" id="error-msg" hidden></div>
        <button type="submit" id="submit-btn" style="width:100%">Sign in</button>
      </form>
    </div>
  </main>
  <script src="/static/app.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
