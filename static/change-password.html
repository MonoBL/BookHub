<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookHub — Change Password</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#16213e">
</head>
<body>
  <main style="max-width:400px;padding-top:4rem">
    <div class="card">
      <h2 style="margin-bottom:0.5rem">Change Password</h2>
      <p style="color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem">You must set a new password before continuing.</p>
      <form id="change-password-form">
        <div class="form-group">
          <label for="current-password">Current Password</label>
          <input type="password" id="current-password" name="current_password" autocomplete="current-password" required>
        </div>
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" name="new_password" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm New Password</label>
          <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required>
        </div>
        <div class="error-msg" id="error-msg" hidden></div>
        <button type="submit" style="width:100%">Change Password</button>
      </form>
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
