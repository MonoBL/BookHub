<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookHub — Change Password</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#16213e">
</head>
<body>
  <main style="max-width:400px;padding-top:4rem">
    <div class="card">
      <h2 style="margin-bottom:0.5rem">Change Password</h2>
      <p style="color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem">
        You must set a new password before continuing.
      </p>
      <form id="change-password-form">
        <div class="form-group">
          <label for="current-password">Current Password</label>
          <input type="password" id="current-password" autocomplete="current-password" required>
        </div>
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" autocomplete="new-password" required minlength="8">
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm New Password</label>
          <input type="password" id="confirm-password" autocomplete="new-password" required>
        </div>
        <div class="error-msg" id="error-msg" hidden></div>
        <button type="submit" id="submit-btn" style="width:100%">Change Password</button>
      </form>
    </div>
  </main>
  <script src="/static/app.js"></script>
  <script>
    (function () {
      const form = document.getElementById("change-password-form");
      const errorEl = document.getElementById("error-msg");
      const btn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.hidden = true;

        const newPw = document.getElementById("new-password").value;
        const confirmPw = document.getElementById("confirm-password").value;

        if (newPw !== confirmPw) {
          errorEl.textContent = "Passwords do not match.";
          errorEl.hidden = false;
          return;
        }

        btn.disabled = true;

        try {
          const resp = await fetch("/api/auth/change-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              current_password: document.getElementById("current-password").value,
              new_password: newPw,
            }),
          });

          if (resp.ok) {
            window.location.href = "/";
          } else {
            const err = await resp.json().catch(() => ({}));
            errorEl.textContent = err.detail || "Failed to change password.";
            errorEl.hidden = false;
            btn.disabled = false;
          }
        } catch {
          errorEl.textContent = "Network error — check your connection.";
          errorEl.hidden = false;
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
